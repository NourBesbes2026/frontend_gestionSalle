<div class="shell">
  <aside class="sidebar" [class.sidebar--collapsed]="sidebarCollapsed()" [class.sidebar--mobile-open]="mobileMenuOpen()">
    <div class="sidebar__brand">
      
      @if (!sidebarCollapsed()) {
            <img 
    src="assets/images/logo_blanc.png" 
    alt="Sopra HR Software"
    class="login__logo"
  />
      }
    </div>

    <nav class="sidebar__nav , nav-item">
      @for (item of navItems; track item.path) {
        <i
          [routerLink]="item.path"
          [routerLinkActiveOptions]="{ exact: item.path === '/employe/reservations' }"
          routerLinkActive="sidebar__link--active"
          class="sidebar__link"
          (click)="closeMobileMenu()"
        >
          <span class="sidebar__icon" [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'door'" viewBox="0 0 24 24" fill="none" style="height:20px ;width: 20px;"><path d="M5 21V5a1 1 0 0 1 1-1h9l4 4v13" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 21h13M15 12v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg *ngSwitchCase="'calendar'" viewBox="0 0 24 24" fill="none" style="height:20px ;width: 20px;"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg *ngSwitchCase="'alert'" viewBox="0 0 24 24" fill="none" style="height:20px ;width: 20px;"><path d="M12 3 2 20h20L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 17v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg *ngSwitchCase="'star'" viewBox="0 0 24 24" fill="none" style="height:20px ;width: 20px;"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
             <svg *ngSwitchCase="'user'" viewBox="0 0 24 24" fill="none" style="height:20px;width:20px;">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5 20c1.5-3 4-5 7-5s5.5 2 7 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          @if (!sidebarCollapsed()) {
            <span class="ecriture ">{{ item.label }}</span>
          }
        </i>
      }
    </nav>

   
  </aside>

  @if (mobileMenuOpen()) {
    <div class="sidebar__scrim" (click)="closeMobileMenu()"></div>
  }

  <div class="content">
    <header class="topbar">
      <button type="button" class="topbar__burger" (click)="toggleMobileMenu()" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>

      <div class="topbar-title">
        <span class="topbar-icon"><i class="ti ti-bolt"></i></span>
        <div>
          <h1>Actions rapides</h1>
          <p>Services disponibles</p>
        </div>
      </div>

     
     

      <div class="topbar__spacer"></div>

      <div class="topbar__user">
        
        <button type="button" class="btn btn--ghost" (click)="logout()">Déconnexion</button>
      </div>
    </header>

    <main class="page">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
